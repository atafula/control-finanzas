<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D6BF5"/>
      <stop offset="1" stop-color="#1F3FBF"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="17" cy="17" r="5.5" fill="#FFFFFF"/>
    </pattern>
    <radialGradient id="fade" cx="1" cy="0" r="1.15">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1024" height="1024" fill="url(#fade)"/></mask>
    <pattern id="hatch" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="17" height="36" fill="#FFFFFF"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1A5C" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#dots)" mask="url(#dotMask)"/>
  <!-- barras del gráfico diario: la tercera, rayada = gasto extraordinario -->
  <g filter="url(#sh)" transform="translate(-16 0)">
    <rect x="200" y="470" width="128" height="334" rx="64" fill="#FFFFFF"/>
    <rect x="376" y="330" width="128" height="474" rx="64" fill="#FFFFFF" fill-opacity=".9"/>
    <rect x="552" y="210" width="128" height="594" rx="64" fill="url(#hatch)" fill-opacity=".85"/>
    <rect x="552" y="210" width="128" height="594" rx="64" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-opacity=".85"/>
    <rect x="728" y="400" width="128" height="404" rx="64" fill="#0E1116"/>
  </g>
</svg>
